name: PetRoom
options:
  bundleIdPrefix: tw.petroom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  PetRoom:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 默默
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: 用來拍攝角色立繪或行事曆截圖
        NSPhotoLibraryUsageDescription: 用來匯入角色立繪、表情差分或 TimeTree 截圖
    entitlements:
      path: App/PetRoom.entitlements
      properties:
        com.apple.security.application-groups: [group.tw.petroom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.petroom.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PetWidget
  PetWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 默默
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PetWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.tw.petroom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.petroom.app.widget
